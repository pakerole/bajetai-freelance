[workspace]
name = "bajetai-freelance-api"
version = "0.1.0"
description = "Backend API for bajetAI.my freelance landing page"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12"
fastapi = ">=0.115.0"
uvicorn = ">=0.34.0"
python-multipart = ">=0.0.18"
pydantic = ">=2.10.0"
aiosqlite = ">=0.21.0"

[tasks]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8010"
